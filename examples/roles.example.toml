verify_terms = ["ServiceNow", "Splunk", "Linux", "Dynatrace", "On-call"]
focus = "Hands-on production troubleshooting, SQL diagnostics, incident resolution, escalation handling, and release stability."
must_include = []
exclude_jobs = []
